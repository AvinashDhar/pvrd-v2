services:
  mysql:
    image: mysql:8.4
    container_name: pvrd-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_USER: pvrd
      MYSQL_PASSWORD: pvrd
      MYSQL_DATABASE: pvrd
      MYSQL_ROOT_PASSWORD: pvrd
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - pvrd_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-upvrd", "-ppvrd"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pvrd_mysql:
